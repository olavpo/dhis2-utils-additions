<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <script>
      // Prevent forms from submitting.
      function preventFormSubmit() {
        var forms = document.querySelectorAll('form');
        for (var i = 0; i < forms.length; i++) {
          forms[i].addEventListener('submit', function(event) {
            event.preventDefault();
          });
        }
      }
      window.addEventListener('load', preventFormSubmit);

      function handleFormSubmit(formObject) {
        google.script.run.receiveInfo(formObject);
        google.script.host.close();
      }
    </script>
  </head>
  <body>
    <form id="auth" onsubmit="handleFormSubmit(this)">
      DHIS2 URL:<br>
      <input name="url" type="url" /><br>
      Username:<br>
      <input name="username" type="text" /><br>
      Password:<br>
      <input name="password" type="password" /><br><br>
      <input type="submit" value="Authenticate" />
    </form>
    <p>URL is stored as a document property. Username is stored as a user property. Password is not persisted.</p>
 </body>
</html>
